name: antiattendance-go
services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: aa
      POSTGRES_USER: aa
      POSTGRES_PASSWORD: ${GO_POSTGRES_PASSWORD:?Set GO_POSTGRES_PASSWORD in .env.go}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U aa -d aa]
      interval: 5s
      timeout: 3s
      retries: 30
  initialize:
    image: antiattendance-go-native:local
    build:
      context: .
      dockerfile: Dockerfile.native
      args:
        BUILD_VERSION: ${AA_BUILD_VERSION:-}
        BUILD_COMMIT: ${AA_BUILD_COMMIT:-unknown}
        BUILD_DIRTY: ${AA_BUILD_DIRTY:-false}
    user: '0:0'
    command: [aa-init, -directory, /keys, -uid, '10001', -schema, -split, -roles, -admin]
    environment:
      DATABASE_URL: postgresql://aa:${GO_POSTGRES_PASSWORD}@postgres:5432/aa?sslmode=disable
      SESSIONS_DB_PASSWORD: ${GO_SESSIONS_DB_PASSWORD:?Set GO_SESSIONS_DB_PASSWORD in .env.go}
      IDENTITY_DB_PASSWORD: ${GO_IDENTITY_DB_PASSWORD:?Set GO_IDENTITY_DB_PASSWORD in .env.go}
      ADMIN_PASSWORD: ${GO_ADMIN_PASSWORD:?Set GO_ADMIN_PASSWORD in .env.go}
    volumes:
      - keys:/keys
    depends_on:
      postgres: {condition: service_healthy}
  sessions:
    image: antiattendance-go-native:local
    restart: unless-stopped
    init: true
    shm_size: 512mb
    stop_grace_period: 45s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:size=512m,mode=1777']
    command: [aa-server, -listen, '0.0.0.0:8080']
    environment:
      DATABASE_URL: postgresql://sessions:${GO_SESSIONS_DB_PASSWORD}@postgres:5432/aa?sslmode=disable
      MASTER_KEY_FILE: /keys/master.key
      ADMIN_PASSWORD: ${GO_ADMIN_PASSWORD:?Set GO_ADMIN_PASSWORD in .env.go}
      PUBLIC_URL: ${GO_PUBLIC_URL:-https://aa.ytc-srv.org}
      AAID_PUBLIC_URL: ${GO_AAID_PUBLIC_URL:-https://aaid.ytc-srv.org}
      AAID_JWKS_URL: http://aaid:8090/.well-known/jwks.json
      PANEL_LOCAL_ONLY: '1'
      REFRESH_SECONDS: ${REFRESH_SECONDS:-180}
      LOGIN_SLOTS: ${LOGIN_SLOTS:-6}
      MIREA_NATIVE_APP_AUTH: ${MIREA_NATIVE_APP_AUTH:-0}
      RENEW_SLOTS: ${RENEW_SLOTS:-2}
      METRICS_FILE: /metrics/snapshot.json
    volumes:
      - type: bind
        source: ${GO_METRICS_DIR:-./.go-data/metrics}
        target: /metrics
        read_only: true
        bind: {create_host_path: true}
      - type: volume
        source: keys
        target: /keys
        read_only: true
        volume: {subpath: sessions}
    depends_on:
      initialize: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, aa-health, 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
  aaid:
    image: antiattendance-go-native:local
    restart: unless-stopped
    init: true
    shm_size: 256mb
    stop_grace_period: 45s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:size=256m,mode=1777']
    command: [aa-id, -listen, '0.0.0.0:8090', -static, aaid-static]
    environment:
      DATABASE_URL: postgresql://aaid:${GO_IDENTITY_DB_PASSWORD}@postgres:5432/aa?sslmode=disable
      SIGNING_KEY_FILE: /keys/signing.key
      ADMIN_TOKEN: ${GO_AAID_ADMIN_TOKEN:-}
      AAID_PUBLIC_URL: ${GO_AAID_PUBLIC_URL:-https://aaid.ytc-srv.org}
      AA_SITE_URL: ${GO_PUBLIC_URL:-https://aa.ytc-srv.org}
      SESSIONS_URL: http://sessions:8080
      TRUST_PROXY_IP: '1'
      MIREA_NATIVE_APP_AUTH: ${MIREA_NATIVE_APP_AUTH:-0}
    ports: ['127.0.0.1:${GO_AAID_PORT:-18091}:8090']
    volumes:
      - type: volume
        source: keys
        target: /keys
        read_only: true
        volume: {subpath: identity}
    depends_on:
      initialize: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, aa-health, 'http://127.0.0.1:8090/health']
      interval: 30s
      timeout: 5s
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:${GO_PORT:-18080}:80', '127.0.0.1:${GO_PANEL_PORT:-18092}:8081']
    volumes: ['./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      sessions: {condition: service_healthy}
      aaid: {condition: service_healthy}
volumes:
  postgres_data:
  keys:
