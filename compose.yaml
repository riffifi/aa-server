name: antiattendance-sessions
services:
  sessions:
    build: .
    restart: unless-stopped
    init: true
    shm_size: 512mb
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=512m,mode=1777
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run install.sh first}
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8080}
      REFRESH_SECONDS: ${REFRESH_SECONDS:-180}
      RENEW_BEFORE_SECONDS: ${RENEW_BEFORE_SECONDS:-900}
      RENEW_INTERVAL_SECONDS: ${RENEW_INTERVAL_SECONDS:-900}
      RENEW_BACKOFF_SECONDS: ${RENEW_BACKOFF_SECONDS:-300}
      LOGIN_SLOTS: ${LOGIN_SLOTS:-6}
      RENEW_SLOTS: ${RENEW_SLOTS:-2}
      MAX_ACTIVE_LOGINS: ${MAX_ACTIVE_LOGINS:-24}
      LOGIN_TTL_SECONDS: ${LOGIN_TTL_SECONDS:-600}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_RELAY_URL: ${TELEGRAM_RELAY_URL:-}
      TELEGRAM_RELAY_KEY: ${TELEGRAM_RELAY_KEY:-}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      TELEGRAM_PROXY_KEY: ${TELEGRAM_PROXY_KEY:-}
      # AA ID tokens are verified with these keys. Set AAID_ENFORCE=1 to require
      # AA ID sign-in on the whole app API (see services/aa-id/README.md for the order).
      AAID_JWKS_URL: ${AAID_JWKS_URL:-http://aaid:8090/.well-known/jwks.json}
      AAID_ENFORCE: ${AAID_ENFORCE:-0}
      AAID_PUBLIC_URL: ${AAID_PUBLIC_URL:-${PUBLIC_URL:-http://127.0.0.1:8080}/id}
    volumes:
      - session_data:/data
  # AA ID: separate account service (own process, database and signing key).
  aaid:
    build: ./services/aa-id
    restart: unless-stopped
    init: true
    shm_size: 256mb
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=256m,mode=1777
    # The AA ID site on its own port, for a separate domain (e.g. id.example.ru)
    # proxied by the host Nginx; see nginx/aaid-host.conf.example.
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${AAID_PORT:-8091}:8090
    environment:
      AAID_PUBLIC_URL: ${AAID_PUBLIC_URL:-${PUBLIC_URL:-http://127.0.0.1:8080}/id}
      LOGIN_SLOTS: ${AAID_LOGIN_SLOTS:-4}
      SESSIONS_URL: http://sessions:8080
      # The AntiAttendance site that signs in with AA ID (codes are sent only there).
      AA_SITE_URL: ${AA_SITE_URL:-${PUBLIC_URL:-http://127.0.0.1:8080}}
      MAX_SESSIONS: ${AAID_MAX_SESSIONS:-2}
      ACCESS_TTL_SECONDS: ${AAID_ACCESS_TTL_SECONDS:-600}
      ADMIN_TOKEN: ${AAID_ADMIN_TOKEN:-}
      # Only Nginx (Docker or host) reaches this container; it passes the client address in X-Real-IP.
      TRUST_PROXY_IP: '1'
    volumes:
      - aaid_data:/data
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/health']
      interval: 30s
      timeout: 5s
      start_period: 10s
    depends_on:
      sessions:
        condition: service_healthy
      aaid:
        condition: service_healthy
volumes:
  session_data:
  aaid_data:
