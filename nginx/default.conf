server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 200000;
    location / {
        proxy_pass http://sessions:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # Discard caller-supplied forwarding headers; application does not trust them.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        proxy_redirect off;
    }
}
