server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 200000;
    # Resolve the containers through Docker DNS on every request (cached 10 s), so a
    # recreated container with a new IP does not leave a stale upstream (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sessions http://sessions:8080;
    set $aaid http://aaid:8090;
    location /id/ {
        rewrite ^/id/(.*)$ /$1 break;
        proxy_pass $aaid;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_redirect off;
    }
    # The admin panel is not served on the public address: see the panel server below.
    location ^~ /panel {
        return 404;
    }
    location / {
        proxy_pass $sessions;
        proxy_set_header X-AA-Panel "";
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # Discard caller-supplied forwarding headers; application does not trust them.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        proxy_redirect off;
    }
}

# The admin panel, published only on the server's own 127.0.0.1 (compose PANEL_PORT).
# Open it on the server or through an SSH tunnel: ssh -L 8092:127.0.0.1:8092 server.
server {
    listen 8081;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 200000;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sessions http://sessions:8080;
    location / {
        proxy_pass $sessions;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-AA-Panel "1";
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
        proxy_redirect off;
    }
}
